<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <title>Them san pham</title>
  </head>
  <body>
    <main layout:fragment="content">
      <form
        class="form-panel"
        th:action="@{/admin/products/insert}"
        th:object="${product}"
        method="post"
        enctype="multipart/form-data"
      >
        <h1>Them san pham</h1>
        <label class="field"
          >Ten san pham<input th:field="*{productName}" required /></label
        ><label class="field"
          >Gia<input
            type="number"
            step="0.01"
            th:field="*{price}"
            required /></label
        ><label class="field"
          >So luong<input
            type="number"
            th:field="*{quantity}"
            required /></label
        ><label class="field"
          >Mo ta<textarea th:field="*{description}" rows="4"></textarea></label
        ><label class="field"
          >Anh<input type="file" name="images" accept="image/*" /></label
        ><label class="field"
          >Danh muc<select name="categoryId" required>
            <option
              th:each="c : ${categories}"
              th:value="${c.categoryId}"
              th:text="${c.categoryName}"
            >
              Danh muc
            </option>
          </select></label
        >
        <div class="field">
          <span>Trang thai</span
          ><label
            ><input type="radio" name="status" value="1" checked /> Hoat
            dong</label
          ><label><input type="radio" name="status" value="0" /> Khoa</label>
        </div>
        <button type="submit">Luu</button>
      </form>
    </main>
  </body>
</html>
