<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <title>Chi tiet san pham</title>
  </head>
  <body>
    <main layout:fragment="content">
      <div class="two-column">
        <div>
          <img
            class="preview"
            style="width: 100%; height: 400px"
            th:if="${product.images != null and #strings.startsWith(product.images, 'http')}"
            th:src="${product.images}"
            th:alt="${product.productName}"
          /><img
            class="preview"
            style="width: 100%; height: 400px"
            th:unless="${product.images != null and #strings.startsWith(product.images, 'http')}"
            th:src="@{/image(fname=${product.images})}"
            th:alt="${product.productName}"
          />
        </div>
        <div>
          <h1 th:text="${product.productName}">San pham</h1>
          <p>
            <strong>Gia:</strong>
            <span th:text="${product.price + ' VND'}">0</span>
          </p>
          <p>
            <strong>So luong:</strong>
            <span th:text="${product.quantity}">0</span>
          </p>
          <p>
            <strong>Danh muc:</strong>
            <span th:text="${product.category.categoryName}">-</span>
          </p>
          <p>
            <strong>Mo ta:</strong>
            <span th:text="${product.description}">-</span>
          </p>
          <a class="button secondary" th:href="@{/product}">Quay lai</a>
        </div>
      </div>
    </main>
  </body>
</html>
