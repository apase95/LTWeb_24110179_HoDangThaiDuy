<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title layout:title-pattern="$CONTENT_TITLE | MyShop">MyShop</title>
    <style>
      :root {
        --ink: #203040;
        --muted: #6b7785;
        --line: #dbe3eb;
        --brand: #276fbf;
        --soft: #f4f7fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--soft);
        font:
          15px/1.5 Georgia,
          "Times New Roman",
          serif;
      }
      a {
        color: var(--brand);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 22px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 8px 26px #20304012;
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .identity img {
        width: 58px;
        height: 58px;
        border-radius: 16px;
      }
      .identity strong {
        display: block;
        font-size: 20px;
      }
      .identity small {
        color: var(--muted);
      }
      .nav-link {
        padding: 8px 12px;
        border-radius: 8px;
        background: #eaf2fb;
      }
      main {
        min-height: 65vh;
        padding: 28px 0;
      }
      .page-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
      }
      .muted {
        color: var(--muted);
      }
      .toolbar,
      .form-panel,
      .table-wrap {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 6px 18px #2030400b;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 14px;
        margin-bottom: 18px;
      }
      input,
      select,
      textarea {
        border: 1px solid #c8d3df;
        border-radius: 7px;
        padding: 9px 11px;
        font: inherit;
      }
      input[type="search"] {
        flex: 1;
        min-width: 180px;
      }
      button,
      .button {
        display: inline-block;
        border: 0;
        border-radius: 7px;
        padding: 9px 14px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      .button.secondary {
        background: #e8eef4;
        color: var(--ink);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 13px 15px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }
      th {
        background: #f7f9fb;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .category-image {
        width: 54px;
        height: 54px;
        object-fit: cover;
        border-radius: 10px;
        background: #edf2f7;
      }
      .status {
        color: #16734b;
        font-weight: bold;
      }
      .status.locked {
        color: #a34b39;
      }
      .actions {
        white-space: nowrap;
      }
      .pagination {
        display: flex;
        justify-content: center;
        gap: 7px;
        list-style: none;
        padding: 18px 0 0;
        margin: 0;
      }
      .pagination a,
      .pagination span {
        display: block;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      .pagination .current {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .form-panel {
        max-width: 700px;
        padding: 24px;
      }
      .auth-panel {
        max-width: 520px;
        margin: 40px auto;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 18px #2030400b;
      }
      .card img {
        width: 100%;
        height: 190px;
        object-fit: cover;
      }
      .card-body {
        padding: 16px;
      }
      .two-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 17px;
      }
      .preview {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 12px;
      }
      .radio-row {
        display: flex;
        gap: 18px;
      }
      .site-footer {
        border-top: 1px solid var(--line);
        padding: 20px 0 10px;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .shell {
          padding: 14px;
        }
        .site-header,
        .page-heading,
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        h1 {
          font-size: 25px;
        }
        .two-column {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script th:inline="javascript">var contextPath = /*[[@{/}]]*/ '/'; contextPath = contextPath.replace(/\/$/, '');</script>
  </head>
  <body>
    <div class="shell">
      <header class="site-header" th:fragment="header">
        <div class="identity">
          <img th:src="@{/images/LinkedIn.jpeg}" alt="Anh cua sinh vien" />
          <div>
            <strong>MyShop</strong><small>Quan ly san pham va danh muc</small>
          </div>
        </div>
        <nav>
          <a class="nav-link" th:href="@{/home}">Trang chu</a>
          <a class="nav-link" th:href="@{/product}">San pham</a>
          <a class="nav-link" th:href="@{/admin/categories}">Quan tri</a>
        </nav>
      </header>
      <main layout:fragment="content"></main>
      <footer class="site-footer" th:fragment="footer">
        MSSV: 24110179, Hồ Đặng Thái Duy
      </footer>
    </div>
  </body>
</html>
